name: "yogo_kds"
description: "A new Flutter project."
publish_to: "none"
version: "1.0.0+1"

environment:
  sdk: "^3.11.4"

dependencies:
  flutter:
    sdk: "flutter"
  google_fonts: ^6.2.1
  flutter_riverpod: "^2.5.1"
  riverpod_annotation: "^2.3.5"
  go_router: "^14.0.0"
  shared_preferences: ^2.5.5
  flex_color_scheme: "^8.4.0"
  package_info_plus: "^10.2.0"
  network_info_plus: "^8.2.0"
  inno_bundle: ^0.12.0
  dio: ^5.11.0
  uuid: ^4.6.0
  socket_io_client: ^3.1.6
  sentry_flutter: ^8.0.0  
  audioplayers: ^6.0.0        # ← NEW (crash/error reporting)

dev_dependencies:
  flutter_test:
    sdk: "flutter"
  flutter_lints: "^3.0.0"
  build_runner: "^2.4.9"
  riverpod_generator: "^2.4.3"
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/ 

# ── App icon generator (Windows) ──
flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

inno_bundle:
  id: 57c5c890-c602-11f1-bf85-a1c6e1728887
  installer_icon: assets/icons/app_icon.ico
  publisher: yogo_kds